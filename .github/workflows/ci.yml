name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Go unit tests and vet
        working-directory: backend
        run: |
          go test ./config ./middleware ./handlers ./repository ./services
          go vet ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync_script/requirements.txt
      - name: Python checks
        working-directory: sync_script
        run: |
          python -m pip install -r requirements.txt
          python -m unittest -v test_import_promo.py test_dedupe_promo.py test_import_network_facts.py

      - name: Validate compose configurations
        env:
          SA_PASSWORD: Stage6_Config_Only_123!
          JWT_SECRET: stage6-config-only-secret-1234567890
          CORS_ORIGINS: https://portal.example.com
          PUBLIC_API_BASE: https://api.portal.example.com
          TRUSTED_PROXIES: 10.0.0.10
          DB_TRUST_SERVER_CERT: "false"
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.existing-db.yml config --quiet

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser smoke tests
        working-directory: frontend
        run: npm run test:e2e

  clean-database:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Stage6_CI_DB_Only_123!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Stage6_CI_DB_Only_123!' -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Apply migrations and run integration tests
        working-directory: backend
        env:
          DB_SERVER: localhost
          DB_PORT: 1433
          DB_USER: sa
          DB_PASSWORD: Stage6_CI_DB_Only_123!
          DB_NAME: analytics_portal_ci_test
          DB_AUTO_CREATE: "true"
          DB_STARTUP_TIMEOUT_SECONDS: "120"
          APP_ENV: test
          JWT_SECRET: stage6-ci-only-jwt-secret-1234567890
        run: go test .
