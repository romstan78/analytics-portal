services:
  mssql_db:
    # В production SQL Server доступен только другим сервисам compose.
    ports: !reset []
    environment:
      MSSQL_PID: ${MSSQL_PID:-Standard}

  backend:
    environment:
      APP_ENV: production
      DB_AUTO_CREATE: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:?Укажите публичный HTTPS origin портала}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?Укажите адреса только доверенных reverse proxy}
      DB_ENCRYPT: ${DB_ENCRYPT:-true}
      # false — сертификат SQL Server проверяется по доверенным корням.
      # true — осознанное доверие самоподписанному сертификату во внутренней сети.
      DB_TRUST_SERVER_CERT: ${DB_TRUST_SERVER_CERT:?Укажите false для проверяемого сертификата SQL Server или true для внутреннего самоподписанного}

  frontend:
    build:
      args:
        VITE_API_BASE: ${PUBLIC_API_BASE:?Укажите публичный HTTPS URL backend}
