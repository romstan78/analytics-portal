server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Версия nginx в ответе ничего не даёт клиенту и экономит работу тому,
    # кто ищет уязвимость под конкретный релиз.
    server_tokens off;

    include /etc/nginx/security-headers.conf;

    # Печатная модель отчёта для страницы /print/report/:id. Её открывает
    # headless Chromium из сети compose, где публичного адреса API
    # (localhost:8081) нет, поэтому страница ходит по относительному пути, а
    # nginx передаёт запрос backend'у. Только этот путь: остальное API
    # фронтенд вызывает напрямую по VITE_API_BASE. Адрес — переменной с
    # резолвером Docker: так nginx поднимается и без backend, а не падает
    # на старте из-за неизвестного имени.
    location ~ ^/api/reports/[^/]+/print$ {
        include /etc/nginx/security-headers.conf;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $report_backend http://backend:8080;
        proxy_pass $report_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    location = /health {
        include /etc/nginx/security-headers.conf;
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # HTML всегда перепроверяем: он содержит имена хешированных bundle-файлов.
    # Сами assets ниже остаются immutable и безопасно кешируются надолго.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        include /etc/nginx/security-headers.conf;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
