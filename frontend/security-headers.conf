# Заголовки безопасности статики.
#
# Файл включается и в server, и в каждый location: nginx отменяет наследование
# add_header от родительского блока, как только в блоке появляется свой, а
# заголовки кеширования есть почти везде. Без include заголовки достались бы
# только тем ответам, у которых своих add_header нет.
#
# Главная защита здесь — CSP: access-токен лежит в localStorage
# (frontend/src/api/promo.ts), поэтому любая XSS означала бы угон сессии.
#
# Источники соответствуют тому, что грузит приложение:
#   style-src 'unsafe-inline' — emotion (MUI) вставляет <style> в head на лету;
#   fonts.googleapis.com/gstatic.com — Inter из index.html;
#   connect-src __API_ORIGIN__ — backend живёт на своём порту, и без него
#   первый же запрос к API был бы заблокирован.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' __API_ORIGIN__" always;
add_header X-Content-Type-Options "nosniff" always;
# X-Frame-Options дублирует frame-ancestors для старых браузеров.
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
